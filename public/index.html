<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css?family=Montserrat" rel="stylesheet" />

  <!-- 关键：viewport 保证移动端缩放一致 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Lure of Returning to the Village: Finding the Secret Recipe Game" />
  
  <!-- 🔧 禁用缓存，确保用户总是获取最新版本 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Lure of Returning to the Village: Finding the Secret Recipe</title>

  <style>
    /* 强制横屏提示 */
    #rotate-tip {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 1.2rem;
      z-index: 9999;
      text-align: center;
      padding: 20px;
      flex-direction: column;
      gap: 20px;
    }

    #rotate-tip .icon {
      font-size: 4rem;
      animation: rotate-phone 2s ease-in-out infinite;
    }

    @keyframes rotate-phone {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }

    /* 当屏幕竖着时显示提示 */
    @media screen and (orientation: portrait) {
      #rotate-tip {
        display: flex;
      }
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <!-- 横屏提示 -->
  <div id="rotate-tip">
    <div class="icon">📱</div>
    <div>
      <div style="font-size: 1.5rem; font-weight: bold; margin-bottom: 10px;">
        请横屏体验游戏
      </div>
      <div style="font-size: 1rem; opacity: 0.8;">
        Please rotate your device to landscape
      </div>
    </div>
  </div>

  <div id="root"></div>
  <!-- React 会自动挂载在这里 -->
</body>

</html>
